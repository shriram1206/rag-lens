[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ram-rag-lens"
version = "0.1.0"
description = "An open-source, pip-installable Python library that quantitatively evaluates RAG pipelines using LLM-as-a-Judge methodology."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shriram M", email = "shriram.coder@gmail.com" }]
keywords = ["rag", "evaluation", "llm", "nlp", "ai", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.11"
dependencies = [
    "groq>=0.9.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.30.0",
    "tenacity>=8.4.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/shriram1206/rag-lens-framework"
Repository = "https://github.com/shriram1206/rag-lens-framework"
Issues = "https://github.com/shriram1206/rag-lens-framework/issues"

[project.scripts]
rag-lens = "rag_lens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/rag_lens"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "RET"]
ignore = ["ANN101", "ANN102", "S101", "E501", "B008", "S110", "C408", "B904", "ANN201", "E741", "ANN001", "RET504", "S324", "UP032", "UP031"]
